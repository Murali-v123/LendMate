# Docker Compose for LendMate (Production & Deployment Stack)
# Authoritative Compose definition.
#
# Runs full 5-service stack on an internal, isolated network:
#   - web: Django application served via Gunicorn (non-root execution)
#   - mysql: MySQL 8.0 database (internal network only; port 3306 NOT exposed publicly)
#   - redis: Redis 7 in-memory cache & broker (internal network only; port 6379 NOT exposed publicly)
#   - celery-worker: Celery background task worker (non-root execution)
#   - celery-beat: Celery periodic task scheduler (non-root execution)
#   - migrate: Controlled one-off database migration runner (docker compose run --rm migrate)
#
# Production Security:
#   - Credential Isolation: MYSQL_ROOT_PASSWORD is ONLY provided to the MySQL container.
#   - Django and Celery services use ONLY the dedicated application database account.
#   - The .env file is NOT indiscriminately injected into application containers.
#   - Database (3306) and Redis (6379) ports are strictly private to 'lendmate-network'.
#   - Health checks ensure Django and Celery only start once MySQL & Redis are healthy.
#   - Non-root user 'lendmate' runs all Python application services.
#
# Controlled Release / Migration:
#   Run migrations in a single, controlled step before starting replicas:
#   docker compose run --rm migrate
#
# For Local Development with host port mapping:
#   Use the development override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  # --- MySQL Database Service ---
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Root credentials are strictly isolated to the MySQL container
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-lendmate}"
      MYSQL_USER: "${MYSQL_USER:-lendmate}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}"
    networks:
      - lendmate-network
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $${MYSQL_USER:-lendmate} -p$${MYSQL_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Redis Cache & Broker Service ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - lendmate-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Database Migration Service (Controlled Release Step) ---
  # Run manually or during CI/CD release: docker compose run --rm migrate
  migrate:
    build: .
    command: python manage.py migrate --noinput
    restart: "no"
    profiles:
      - tools
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}"
      DJANGO_TIME_ZONE: "${DJANGO_TIME_ZONE:-Asia/Kolkata}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-lendmate}"
      MYSQL_USER: "${MYSQL_USER:-lendmate}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_SSL_CA: "${MYSQL_SSL_CA:-}"
      MYSQL_SSL_MODE: "${MYSQL_SSL_MODE:-}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    networks:
      - lendmate-network
    depends_on:
      mysql:
        condition: service_healthy

  # --- Django Web Application Service ---
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Application database account only (NO MYSQL_ROOT_PASSWORD)
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      DJANGO_TIME_ZONE: "${DJANGO_TIME_ZONE:-Asia/Kolkata}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-lendmate}"
      MYSQL_USER: "${MYSQL_USER:-lendmate}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_SSL_CA: "${MYSQL_SSL_CA:-}"
      MYSQL_SSL_MODE: "${MYSQL_SSL_MODE:-}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WHATSAPP_BACKEND: "${WHATSAPP_BACKEND:-notifications.whatsapp.MockWhatsAppBackend}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_BUSINESS_ACCOUNT_ID: "${WHATSAPP_BUSINESS_ACCOUNT_ID:-}"
      WHATSAPP_API_VERSION: "${WHATSAPP_API_VERSION:-v20.0}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN:-}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-LendMate <no-reply@lendmate.local>}"
      EMAIL_HOST: "${EMAIL_HOST:-localhost}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-true}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
    networks:
      - lendmate-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Celery Asynchronous Worker Service ---
  celery-worker:
    build: .
    command: celery -A config worker --loglevel=info --concurrency=2
    restart: unless-stopped
    environment:
      # Application database account only (NO MYSQL_ROOT_PASSWORD)
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}"
      DJANGO_TIME_ZONE: "${DJANGO_TIME_ZONE:-Asia/Kolkata}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-lendmate}"
      MYSQL_USER: "${MYSQL_USER:-lendmate}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_SSL_CA: "${MYSQL_SSL_CA:-}"
      MYSQL_SSL_MODE: "${MYSQL_SSL_MODE:-}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WHATSAPP_BACKEND: "${WHATSAPP_BACKEND:-notifications.whatsapp.MockWhatsAppBackend}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_BUSINESS_ACCOUNT_ID: "${WHATSAPP_BUSINESS_ACCOUNT_ID:-}"
      WHATSAPP_API_VERSION: "${WHATSAPP_API_VERSION:-v20.0}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN:-}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
    networks:
      - lendmate-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Celery Beat Task Scheduler Service ---
  celery-beat:
    build: .
    command: celery -A config beat --loglevel=info
    restart: unless-stopped
    environment:
      # Application database account only (NO MYSQL_ROOT_PASSWORD)
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}"
      DJANGO_TIME_ZONE: "${DJANGO_TIME_ZONE:-Asia/Kolkata}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-lendmate}"
      MYSQL_USER: "${MYSQL_USER:-lendmate}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_SSL_CA: "${MYSQL_SSL_CA:-}"
      MYSQL_SSL_MODE: "${MYSQL_SSL_MODE:-}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WHATSAPP_BACKEND: "${WHATSAPP_BACKEND:-notifications.whatsapp.MockWhatsAppBackend}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_BUSINESS_ACCOUNT_ID: "${WHATSAPP_BUSINESS_ACCOUNT_ID:-}"
      WHATSAPP_API_VERSION: "${WHATSAPP_API_VERSION:-v20.0}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN:-}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
    networks:
      - lendmate-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  lendmate-network:
    driver: bridge

volumes:
  mysql_data:
